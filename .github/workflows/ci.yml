name: CI

on:
  push:
  pull_request:

jobs:
  # Builds each configuration once; the test jobs below run the suites in parallel against its executables.
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - uses: microsoft/setup-msbuild@v3

      - name: Build
        shell: pwsh
        run: msbuild AppleWinHarness.sln -m -p:Configuration=${{ matrix.config }} -p:Platform=x64
        # a failing msbuild exits non-zero, which fails the step

      - name: Upload the executables for the test jobs
        uses: actions/upload-artifact@v7.0.2
        with:
          name: bin-${{ matrix.config }}
          path: |
            bin/x64/${{ matrix.config }}/AppleWinHarness.exe
            bin/x64/${{ matrix.config }}/HarnessTests.exe
          if-no-files-found: error

      - uses: actions/setup-python@v7.0.0
        if: matrix.config == 'Release'
        with:
          python-version: '3.13'

      - name: Build the release bundle
        if: matrix.config == 'Release'
        shell: pwsh
        run: |
          ./tools/make_release.ps1
          $version = (Get-Content VERSION -Raw).Trim()
          "BUNDLE_ZIP=$env:GITHUB_WORKSPACE\dist\applewin-harness-$version-win64.zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Extract the bundle outside the repository
        if: matrix.config == 'Release'
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP 'bundle'
          Expand-Archive -LiteralPath $env:BUNDLE_ZIP -DestinationPath $dest -Force
          $root = (Get-ChildItem $dest -Directory | Select-Object -First 1).FullName
          "HARNESS_BUNDLE_DIR=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Bundle tests (smoke test and layout checks, run from outside the repository)
        if: matrix.config == 'Release'
        shell: pwsh
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m pip install -r adapter/requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tests = Join-Path $env:GITHUB_WORKSPACE 'tests'
          # test_mcp's module fixture launches HARNESS_EXE (default: the Debug exe, which this job doesn't build).
          $env:HARNESS_EXE = Join-Path $env:HARNESS_BUNDLE_DIR 'AppleWinHarness.exe'
          Set-Location $env:RUNNER_TEMP
          python -m unittest discover -s "$tests\adapter" -p test_mcp.py -k BundleSmokeTest -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s "$tests\python" -p test_licensing.py -k BundleTest -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload the release bundle
        if: matrix.config == 'Release'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: applewin-harness-win64
          path: ${{ env.BUNDLE_ZIP }}
          if-no-files-found: error

      - name: Build the source archive (the GPL corresponding source, with the AppleWin submodule)
        if: matrix.config == 'Release'
        shell: pwsh
        run: |
          ./tools/make_source_archive.ps1
          $version = (Get-Content VERSION -Raw).Trim()
          "SOURCE_ZIP=$env:GITHUB_WORKSPACE\dist\applewin-harness-$version-source.zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload the source archive
        if: matrix.config == 'Release'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: applewin-harness-source
          path: ${{ env.SOURCE_ZIP }}
          if-no-files-found: error

  test:
    needs: build
    runs-on: windows-2022
    # The slowest suite (adapter, Debug) takes about 12 minutes
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
        suite: [harness, python, adapter]
    env:
      HARNESS_EXE: ${{ github.workspace }}\bin\x64\${{ matrix.config }}\AppleWinHarness.exe
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive   # the tests boot the DOS 3.3 image in external/AppleWin

      - uses: actions/download-artifact@v8.0.2
        with:
          name: bin-${{ matrix.config }}
          path: bin/x64/${{ matrix.config }}

      - uses: actions/setup-python@v7.0.0
        if: matrix.suite != 'harness'
        with:
          python-version: '3.13'

      - name: Record harness temp path
        shell: pwsh
        run: '"HARNESS_TMP=$env:TEMP\applewin-harness" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8'

      - name: HarnessTests (headless suites; windowed and audio need a desktop and sound device)
        if: matrix.suite == 'harness'
        shell: pwsh
        run: |
          & "bin\x64\${{ matrix.config }}\HarnessTests.exe" "-tse=windowed,audio"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Python pipe tests (--serve --headless)
        if: matrix.suite == 'python'
        shell: pwsh
        run: |
          python -m unittest discover -s tests/python -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Adapter tests (MCP server, headless)
        if: matrix.suite == 'adapter'
        shell: pwsh
        run: |
          python -m pip install -r adapter/requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests/adapter -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload harness temp files on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: applewin-harness-temp-${{ matrix.config }}-${{ matrix.suite }}
          path: ${{ env.HARNESS_TMP }}
          if-no-files-found: ignore
